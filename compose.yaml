name: ytt-test

x-app: &app
    image: ytt-local:dev
    build:
        context: .
        target: app
    env_file: .env.docker
    volumes:
        - storage:/var/www/html/storage
    restart: unless-stopped
    init: true
    # The Apache base image defaults to SIGWINCH; PHP workers need SIGTERM.
    stop_signal: SIGTERM
    logging:
        driver: json-file
        options:
            max-size: 10m
            max-file: '3'

services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Use scripts/docker.ps1 up}
            MYSQL_USER: ${DB_USERNAME:?Use scripts/docker.ps1 up}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Use scripts/docker.ps1 up}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Use scripts/docker.ps1 up}
        volumes:
            - mysql:/var/lib/mysql
        restart: unless-stopped
        healthcheck:
            test:
                [
                    CMD-SHELL,
                    'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

    redis:
        image: redis:7.4-alpine
        command: [redis-server, --appendonly, 'yes']
        volumes:
            - redis:/data
        restart: unless-stopped
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 5s
            timeout: 3s
            retries: 10

    init:
        <<: *app
        command: [init]
        restart: 'no'
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    app:
        <<: *app
        stop_signal: SIGWINCH
        ports:
            - '127.0.0.1:${YTT_HTTP_PORT:-8090}:80'
        depends_on:
            init:
                condition: service_completed_successfully
            reverb:
                condition: service_healthy
        healthcheck:
            test: [CMD, curl, --fail, --silent, http://localhost/up]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    reverb:
        <<: *app
        user: www-data
        command: [php, artisan, reverb:start, --host=0.0.0.0, --port=8080]
        ports:
            - '127.0.0.1:${YTT_REVERB_PORT:-8085}:8080'
        depends_on:
            init:
                condition: service_completed_successfully
        healthcheck:
            test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);']
            interval: 5s
            timeout: 3s
            retries: 15

    queue:
        <<: *app
        user: www-data
        command:
            [
                php,
                artisan,
                queue:work,
                tabletop,
                --queue=cues,
                --sleep=0.1,
                --tries=3,
                --timeout=60,
                --max-time=3600,
            ]
        stop_grace_period: 75s
        depends_on:
            init:
                condition: service_completed_successfully
            reverb:
                condition: service_healthy

    scheduler:
        <<: *app
        user: www-data
        command: [php, artisan, schedule:work, --no-interaction]
        depends_on:
            init:
                condition: service_completed_successfully

    frontend:
        image: ytt-frontend:dev
        build:
            context: .
            target: frontend
        profiles: [tools]
        command: [npm, run, test]

volumes:
    mysql:
    redis:
    storage:
